<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLOVR Outreach</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14120F">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg:        #14120F;
    --surface:   #201C17;
    --surface-2: #2A241D;
    --border:    #37312A;
    --text:      #F2EDE4;
    --text-dim:  #9A9086;
    --terracotta:#C1622D;
    --clover:    #6B8F71;
    --amber:     #D4A73D;
    --danger:    #B85C4A;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- Auth gate ---------- */
  #authGate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }

  #authGate.hidden { display: none; }

  .auth-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }

  .clover-mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    position: relative;
  }

  .clover-mark .leaf {
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--terracotta);
  }
  .leaf.tl { top: 0; left: 0; }
  .leaf.tr { top: 0; right: 0; }
  .leaf.bl { bottom: 10px; left: 0; }
  .leaf.br { bottom: 10px; right: 0; }
  .clover-mark .stem {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 20px;
    background: var(--clover);
    border-radius: 2px;
  }

  .auth-card h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }

  .auth-card p {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 24px;
  }

  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    font-family: var(--font-mono);
    margin-bottom: 14px;
  }

  input[type="password"]:focus {
    outline: 2px solid var(--terracotta);
    outline-offset: 1px;
  }

  .remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-start;
    margin-bottom: 20px;
    color: var(--text-dim);
    font-size: 13px;
  }

  .remember-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--terracotta);
  }

  button {
    font-family: var(--font-body);
    cursor: pointer;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--terracotta);
    border: none;
    border-radius: 10px;
    color: #14120F;
    font-weight: 600;
    font-size: 15px;
  }

  .btn-primary:active { opacity: 0.85; }

  .auth-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 12px;
    min-height: 16px;
  }

  /* ---------- Main app ---------- */
  #app.hidden { display: none; }

  header.top {
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  header.top .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header.top .brand-mark {
    width: 20px;
    height: 20px;
    position: relative;
    flex-shrink: 0;
  }
  header.top .brand-mark .leaf {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--terracotta);
  }
  header.top .brand-mark .tl { top: 0; left: 0; }
  header.top .brand-mark .tr { top: 0; right: 0; }
  header.top .brand-mark .bl { bottom: 3px; left: 0; }
  header.top .brand-mark .br { bottom: 3px; right: 0; }

  header.top h2 {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }

  #accountLabel {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .status-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .status-pill.running .dot { background: var(--clover); }
  .status-pill.paused .dot { background: var(--amber); }

  main {
    flex: 1;
    padding: 24px 20px 100px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }

  /* Signature gauge */
  .gauge-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0 28px;
  }

  .gauge-wrap {
    position: relative;
    width: 190px;
    height: 190px;
  }

  .gauge-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }

  .gauge-track {
    fill: none;
    stroke: var(--surface-2);
    stroke-width: 14;
  }

  .gauge-fill {
    fill: none;
    stroke: var(--clover);
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s ease, stroke 0.4s ease;
  }

  .gauge-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .gauge-number {
    font-family: var(--font-mono);
    font-size: 40px;
    font-weight: 600;
    line-height: 1;
  }

  .gauge-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    text-align: center;
    max-width: 120px;
  }

  /* Stat grid */
  .section-label {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 28px 0 12px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .stat-card .val {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
  }

  .stat-card .lbl {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .stat-card.warn .val { color: var(--amber); }
  .stat-card.good .val { color: var(--clover); }

  .run-note {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .run-note strong { color: var(--text); }

  /* Bottom action bar */
  .action-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    background: rgba(20,18,15,0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    max-width: 480px;
    margin: 0 auto;
  }

  .action-btn {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-body);
  }

  .action-btn.primary {
    background: var(--terracotta);
    color: #14120F;
    border: none;
  }

  .action-btn:active { opacity: 0.8; }
  .action-btn:disabled { opacity: 0.4; }

  .refresh-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 16px;
    font-family: var(--font-mono);
  }

  .account-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .account-card .row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .account-card .acc-name {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 180px;
  }

  .account-card .acc-status {
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 3px 8px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .account-card .acc-status .dot { width: 6px; height: 6px; border-radius: 50%; }
  .acc-status.ok .dot { background: var(--clover); }
  .acc-status.paused .dot { background: var(--amber); }
  .acc-status.error .dot { background: var(--danger); }

  .account-card .row2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .account-card .row2 strong { color: var(--text); font-family: var(--font-mono); }

  .account-card .row3 { display: flex; gap: 8px; }

  .mini-btn {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 11px;
    font-weight: 600;
  }
  .mini-btn:disabled { opacity: 0.4; }

  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

  <!-- ============ AUTH GATE ============ -->
  <div id="authGate">
    <div class="auth-card">
      <div class="clover-mark">
        <div class="leaf tl"></div><div class="leaf tr"></div>
        <div class="leaf bl"></div><div class="leaf br"></div>
        <div class="stem"></div>
      </div>
      <h1>CLOVR Outreach</h1>
      <p>Enter your dashboard password once</p>
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
      <div class="remember-row">
        <input type="checkbox" id="rememberCheck" checked>
        <label for="rememberCheck">Remember on this device — don't ask again</label>
      </div>
      <button class="btn-primary" id="unlockBtn">Unlock</button>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <!-- ============ MAIN APP ============ -->
  <div id="app" class="hidden">
    <header class="top">
      <div class="brand">
        <div class="brand-mark">
          <div class="leaf tl"></div><div class="leaf tr"></div>
          <div class="leaf bl"></div><div class="leaf br"></div>
        </div>
        <div>
          <h2>CLOVR Outreach</h2>
          <div id="accountLabel">11 accounts</div>
        </div>
      </div>
      <div class="status-pill running" id="statusPill">
        <div class="dot"></div>
        <span id="statusText">Fleet</span>
      </div>
    </header>

    <main>
      <div class="gauge-section">
        <div class="gauge-wrap">
          <svg viewBox="0 0 190 190">
            <circle class="gauge-track" cx="95" cy="95" r="80"></circle>
            <circle class="gauge-fill" id="gaugeFill" cx="95" cy="95" r="80"
              stroke-dasharray="502" stroke-dashoffset="502"></circle>
          </svg>
          <div class="gauge-center">
            <div class="gauge-number" id="gaugeNumber">—</div>
            <div class="gauge-label" id="gaugeLabel">emails left across fleet</div>
          </div>
        </div>
      </div>

      <div class="section-label">Fleet lifetime totals</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="val" id="lifeSent">—</div><div class="lbl">Total sent</div></div>
        <div class="stat-card good"><div class="val" id="lifeReplied">—</div><div class="lbl">Replies</div></div>
        <div class="stat-card"><div class="val" id="lifeReplyRate">—</div><div class="lbl">Reply rate</div></div>
        <div class="stat-card warn"><div class="val" id="lifeBounceRate">—</div><div class="lbl">Bounce rate</div></div>
      </div>

      <div class="section-label">Accounts <span id="accountCountLabel"></span></div>
      <div id="accountList"></div>

      <div class="refresh-note" id="lastUpdated">—</div>
    </main>

    <div class="action-bar">
      <button class="action-btn" id="refreshBtn">Refresh all</button>
      <button class="action-btn primary" id="runAllBtn">Run all now</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ================================================
    // CONFIG — one entry per Gmail account. Same password must be set
    // via setDashboardPassword() in EVERY one of these 11 Apps Script
    // projects, so a single login here works across all of them.
    // ================================================
    const ACCOUNTS = [
      { label: "Account 1", url: "EXEC_URL_1" },
      { label: "Account 2", url: "EXEC_URL_2" },
      { label: "Account 3", url: "EXEC_URL_3" },
      { label: "Account 4", url: "EXEC_URL_4" },
      { label: "Account 5", url: "EXEC_URL_5" },
      { label: "Account 6", url: "EXEC_URL_6" },
      { label: "Account 7", url: "EXEC_URL_7" },
      { label: "Account 8", url: "EXEC_URL_8" },
      { label: "Account 9", url: "EXEC_URL_9" },
      { label: "Account 10", url: "EXEC_URL_10" },
      { label: "Account 11", url: "EXEC_URL_11" }
    ];

    // ================================================
    // Auth
    // ================================================
    const authGate   = document.getElementById('authGate');
    const app        = document.getElementById('app');
    const passInput  = document.getElementById('passwordInput');
    const rememberCk = document.getElementById('rememberCheck');
    const unlockBtn  = document.getElementById('unlockBtn');
    const authError  = document.getElementById('authError');

    let TOKEN = localStorage.getItem('clovr_token') || sessionStorage.getItem('clovr_token');

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    async function callApiFor(account, action, extraParams) {
      const params = new URLSearchParams({ action, token: TOKEN, ...(extraParams || {}) });
      const res = await fetch(`${account.url}?${params.toString()}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    async function tryUnlock(token) {
      TOKEN = token;
      // Just confirm the password works against the first configured account.
      const data = await callApiFor(ACCOUNTS[0], 'status');
      return data;
    }

    unlockBtn.addEventListener('click', async () => {
      const val = passInput.value.trim();
      if (!val) return;
      authError.textContent = '';
      unlockBtn.textContent = 'Checking…';
      try {
        await tryUnlock(val);
        if (rememberCk.checked) {
          localStorage.setItem('clovr_token', val);
        } else {
          sessionStorage.setItem('clovr_token', val);
        }
        enterApp();
      } catch (e) {
        authError.textContent = 'Wrong password or connection issue — try again.';
        unlockBtn.textContent = 'Unlock';
      }
    });

    passInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlockBtn.click();
    });

    function enterApp() {
      authGate.classList.add('hidden');
      app.classList.remove('hidden');
      loadStatus();
    }

    // ================================================
    // Dashboard rendering — fleet-wide across all configured accounts
    // ================================================
    function setGauge(remaining, cap) {
      const pct = cap > 0 ? Math.max(0, Math.min(1, remaining / cap)) : 0;
      const circumference = 502; // 2 * PI * 80, rounded
      const offset = circumference * (1 - pct);
      const fill = document.getElementById('gaugeFill');
      fill.style.strokeDashoffset = offset;

      let color = 'var(--clover)';
      if (pct <= 0.15) color = 'var(--danger)';
      else if (pct <= 0.4) color = 'var(--amber)';
      fill.style.stroke = color;

      document.getElementById('gaugeNumber').textContent = remaining;
    }

    let lastResults = []; // cached per-account results, so button clicks don't need a full refetch to find their account

    function renderAccountCard(account, result) {
      const div = document.createElement('div');
      div.className = 'account-card';

      if (result.error) {
        div.innerHTML = `
          <div class="row1">
            <span class="acc-name">${account.label}</span>
            <span class="acc-status error"><span class="dot"></span>Error</span>
          </div>
          <div class="row2">${result.error}</div>
        `;
        return div;
      }

      const data = result.data;
      const paused = data.paused;
      const remaining = data.remainingQuotaToday ?? '—';
      const lt = data.lifetime || {};

      div.innerHTML = `
        <div class="row1">
          <span class="acc-name">${data.account || account.label}</span>
          <span class="acc-status ${paused ? 'paused' : 'ok'}"><span class="dot"></span>${paused ? 'Paused' : 'Running'}</span>
        </div>
        <div class="row2">
          <span><strong>${remaining}</strong> left today</span>
          <span><strong>${lt.sent ?? 0}</strong> lifetime sent</span>
        </div>
        <div class="row3">
          <button class="mini-btn pause-btn">${paused ? 'Resume' : 'Pause'}</button>
          <button class="mini-btn run-btn">Run now</button>
        </div>
      `;

      div.querySelector('.pause-btn').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        try {
          await callApiFor(account, paused ? 'resume' : 'pause');
          showToast(`${account.label}: ${paused ? 'resumed' : 'paused'}`);
          await loadStatus();
        } catch (err) {
          showToast(`${account.label}: action failed`);
          btn.disabled = false;
        }
      });

      div.querySelector('.run-btn').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = 'Running…';
        try {
          await callApiFor(account, 'runNow');
          showToast(`${account.label}: run triggered`);
          setTimeout(loadStatus, 4000);
        } catch (err) {
          showToast(`${account.label}: run failed`);
        }
        btn.disabled = false;
        btn.textContent = 'Run now';
      });

      return div;
    }

    async function loadStatus() {
      const results = await Promise.allSettled(
        ACCOUNTS.map((acc) => callApiFor(acc, 'status'))
      );

      lastResults = results.map((r, i) => ({
        account: ACCOUNTS[i],
        error: r.status === 'rejected' ? r.reason.message : null,
        data: r.status === 'fulfilled' ? r.value : null
      }));

      // Fleet totals
      let totalRemaining = 0, totalCap = 0;
      let ltSent = 0, ltReplied = 0, ltBounced = 0;
      let okCount = 0;

      lastResults.forEach((r) => {
        if (r.error) return;
        okCount++;
        totalRemaining += r.data.remainingQuotaToday || 0;
        totalCap += 100; // assumes 100/day consumer cap per account
        const lt = r.data.lifetime || {};
        ltSent += lt.sent || 0;
        ltReplied += lt.replied || 0;
        ltBounced += lt.bounced || 0;
      });

      setGauge(totalRemaining, totalCap);
      document.getElementById('gaugeLabel').textContent = `left today across ${okCount}/${ACCOUNTS.length} accounts`;

      document.getElementById('lifeSent').textContent = ltSent || '—';
      document.getElementById('lifeReplied').textContent = ltReplied || '—';
      document.getElementById('lifeReplyRate').textContent = ltSent > 0 ? ((ltReplied / ltSent) * 100).toFixed(1) + '%' : '—';
      document.getElementById('lifeBounceRate').textContent = ltSent > 0 ? ((ltBounced / ltSent) * 100).toFixed(1) + '%' : '—';

      document.getElementById('accountCountLabel').textContent = `(${okCount}/${ACCOUNTS.length} online)`;

      const list = document.getElementById('accountList');
      list.innerHTML = '';
      lastResults.forEach((r) => list.appendChild(renderAccountCard(r.account, r)));

      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    document.getElementById('refreshBtn').addEventListener('click', loadStatus);

    document.getElementById('runAllBtn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = 'Running…';
      const outcomes = await Promise.allSettled(
        ACCOUNTS.map((acc) => callApiFor(acc, 'runNow'))
      );
      const failed = outcomes.filter((o) => o.status === 'rejected').length;
      showToast(failed > 0 ? `Triggered, ${failed} account(s) failed` : 'Run triggered on all accounts');
      setTimeout(loadStatus, 5000);
      btn.disabled = false;
      btn.textContent = 'Run all now';
    });

    // ================================================
    // Boot
    // ================================================
    (async function boot() {
      if (TOKEN) {
        try {
          await callApiFor(ACCOUNTS[0], 'status');
          enterApp();
          return;
        } catch (e) {
          // stored token no longer works — fall through to asking again
          localStorage.removeItem('clovr_token');
          sessionStorage.removeItem('clovr_token');
        }
      }
      // show auth gate (default state)
    })();

    // Register service worker for installability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
